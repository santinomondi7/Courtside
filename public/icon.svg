<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15191F"/>
      <stop offset="100%" stop-color="#0B0D10"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8243"/>
      <stop offset="100%" stop-color="#FF6B2C"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B7F56A"/>
      <stop offset="100%" stop-color="#88D436"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#262C36" stroke-width="3"/>
  
  <!-- Subtle basketball court arc lines in background -->
  <path d="M 60 256 A 196 196 0 0 1 452 256" fill="none" stroke="#1F2633" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="88" fill="none" stroke="#222B3A" stroke-width="4"/>
  <line x1="256" y1="60" x2="256" y2="452" stroke="#1F2633" stroke-width="4"/>
  <line x1="60" y1="256" x2="452" y2="256" stroke="#1F2633" stroke-width="4"/>

  <!-- Glowing Courtside Symbol: High Performance Basket Ring + Geometric 'C' -->
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#orangeGrad)" stroke-width="18" stroke-linecap="round" stroke-dasharray="640 180" transform="rotate(-30 256 256)" filter="url(#glow)"/>
  
  <!-- Inner Backboard & Explosive V vector -->
  <path d="M 176 196 L 256 148 L 336 196 L 256 380 Z" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" opacity="0.15"/>
  
  <!-- Lightning Bolt / Vertical Jump Chevron in Center -->
  <path d="M 256 120 L 310 236 L 260 236 L 300 360 L 202 248 L 252 248 Z" fill="url(#orangeGrad)"/>
  <circle cx="370" cy="142" r="14" fill="url(#accentGrad)" filter="url(#glow)"/>
  
  <!-- Rim Net subtle dots -->
  <circle cx="256" cy="400" r="6" fill="#B7F56A"/>
  <circle cx="236" cy="414" r="5" fill="#FF6B2C"/>
  <circle cx="276" cy="414" r="5" fill="#FF6B2C"/>
</svg>
